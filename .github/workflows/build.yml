
name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Windows and Linux installers to a GitHub Release (direct download link + auto-update feed)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build Windows app
        shell: pwsh
        env:
          # Code signing: add these two repository secrets (a base64 .pfx or a
          # URL, and its password) and the installer is signed automatically.
          # Without them the build is unsigned, which makes browsers warn.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm run build:platform-native-helpers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win dir nsis --x64 --publish never

      - name: Smoke test packaged Windows paths
        run: npm run smoke:packaged-binaries

      - name: Generate Windows artifact checksums
        run: npm run checksums:release -- SHA256SUMS-windows.txt

      - name: Attest Windows artifacts
        # Attestation needs a public repo or a paid plan; do not block the build on it.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-windows.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            arch_tag: darwin-x64
            runner: macos-15-intel
          - arch: arm64
            arch_tag: darwin-arm64
            runner: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build macOS app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build
          npx electron-builder --mac dir dmg zip --${{ matrix.arch }} --publish never

      - name: Smoke test packaged macOS paths
        env:
          PACKAGED_SMOKE_ARCH_TAGS: ${{ matrix.arch_tag }}
        run: npm run smoke:packaged-binaries

      - name: Generate macOS artifact checksums
        run: npm run checksums:release -- SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Attest macOS artifacts
        # Attestation needs a public repo or a paid plan; do not block the build on it.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxtst-dev libxkbfile-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Remove stale uiohook build output
        run: rm -rf node_modules/uiohook-napi/build

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build Linux app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build
          npx electron-builder --linux dir AppImage --x64 --publish never

      - name: Smoke test packaged Linux paths
        run: npm run smoke:packaged-binaries

      - name: Generate Linux artifact checksums
        run: npm run checksums:release -- SHA256SUMS-linux.txt

      - name: Attest Linux artifacts
        # Attestation needs a public repo or a paid plan; do not block the build on it.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-linux.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            release/**/*.AppImage
            release/**/*.blockmap
            release/latest-linux.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          mapfile -t FILES < <(find artifacts/windows-x64-release artifacts/linux-x64-release -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest*.yml' -o -name 'SHA256SUMS*.txt' \))
          printf 'Uploading %s\n' "${FILES[@]}"
          NOTES="CamVerse ${VERSION}. Windows: download CamVerse-Setup-${VERSION}.exe. CamVerse is based on Recordly (AGPL-3.0); source code is in this repository."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "CamVerse ${VERSION}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
